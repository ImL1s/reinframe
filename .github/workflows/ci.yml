name: Reinframe CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download Go Dependencies
        run: go mod download

      - name: Verify Code Formatting & Vet
        run: go vet ./...

      - name: Run Unit & Integration Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Compile Package Binaries
        run: go build -v ./...
